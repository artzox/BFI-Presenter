; BFI Presenter settings (DX add-on and Vulkan layer) -- REFERENCE COPY. Your own BFIPresenter.ini is created and
; kept up to date automatically; copy lines from here only if you want a setting's comment.
; -- easier to change in the "BFI Presenter" window of the
; ReShade overlay (Save button writes them here). Ctrl+Shift+R reloads this file.
[BFI]
; 1 = BFI on, 0 = presenter only (no BFI) -- Ctrl+Shift+B toggles
Enabled=1
; 0 = BFI (hard black frames, highlight roll-off), 1 = Variable MPRT (brightness budget)
; Ctrl+Shift+M toggles
Method=1
; Sub-frames per cycle: 2 = one lit + one dark refresh (60 Hz strobe at 120 Hz)
Frames=2
; Average light kept vs no BFI. 0.5 = lit frame unchanged; 1.0 = full brightness
; (BFI rolls off what does not fit, Variable MPRT spills it into the dark frame)
Gain=0.5
; Dark frame level as a fraction of the signal (0 = black)
DarkFloor=0.0
SineBFI=0
InvertCycle=0
; BFI method only: hue-preserving shoulder instead of per-channel clipping
HighlightRolloff=1
RolloffKnee=0.75
; LCD monitors (IPS, VA, TN) only, not needed on OLED: with an even Frames value every lit refresh gets the
; same LCD drive polarity, which can leave a ghost of the image (temporary image retention). 1 = every
; LcdPhaseSwapSeconds fade briefly (~0.4 s) to the steady picture and back, moving the lit refreshes to the other polarity.
LcdPhaseSwap=0
; Seconds of full strobe between phase swaps (1-300). 30 still left retention on an IPS panel; lower if you see any
LcdPhaseSwapSeconds=5
; How the lit refreshes are moved: 0 = Immediate (the fade and shift above), 1 = Gradual (after the Blur Busters
; CRT simulator's LCD Saver): the light slides slowly into the next refresh, with no fade and no stutter.
; Plain strobe only (not with SineBFI, InvertCycle or RollingScan, which use Immediate).
LcdSaverGradual=0
; Gradual at Frames=2: hold, drift, hold. Seconds the light stays fully on one refresh (0-600; 0 = drift continuously).
; Lower it (e.g. 30) if you see a ghost image
LcdGradualHoldSeconds=120
; Gradual at Frames=2: seconds one slide to the other refresh takes (2-60). Longer is gentler but soft for longer
LcdGradualDriftSeconds=10
; Gradual at Frames=4 and up (or hold 0): seconds for the light to drift once through the whole cycle (20-1200)
LcdGradualSeconds=1000
; Rolling scan (Ctrl+Shift+S), for 240 Hz+ displays: one horizontal band per sub-frame, lit in turn from
; the top down like a CRT beam (240 Hz: Frames=4, Quarter cap, Sine BFI on). At 120 Hz it can only swap
; two halves with a fixed seam in the middle. Works with both methods (the MPRT brightness budget applies).
RollingScan=0
; Blended zone between bands, as a share of the screen height (0 = hard edge). Used only with decay 0.
; Pixels in the zone are lit in both sub-frames, so the seam blurs in motion.
RollingSeam=0.0
; Rolling scan phosphor decay, in sub-frames (0 = off: hard bands with the seam above). Each row lights when the
; simulated beam passes it and fades out over this long, like CRT phosphor (Blur Busters CRT simulator style):
; no seam, smoother look, less visible flicker, slightly more blur. 0.2-0.4 is a good start.
RollingPhosphorDecay=0.2
; Panel peak in nits -- the ceiling for roll-off and the MPRT budget in HDR
DisplayPeakNits=1400
; auto | sdr | scrgb | hdr10   (auto uses the swap chain's colour space)
Output=auto
; Game frame cap: 0 = off, 1 = refresh rate (like VSync),
; 2 = half refresh (60 fps at 120 Hz: every game frame shown once lit -- smoothest with Frames=2),
; 3 = quarter refresh (30 fps at 120 Hz: every game frame shown lit twice, evenly),
; 4 = one game frame per strobe cycle (refresh / Frames: 60 fps at 360 Hz with Frames=6, 90 fps with Frames=4),
; 5 = custom: a new game frame every CapDivisor refreshes (use a multiple of Frames)
CapGameToRefresh=1
; Refreshes per game frame for CapGameToRefresh=5 (1-8)
CapDivisor=3
; Automatic frame cap with CapGameToRefresh=1 (1 = on, default): while the game can't hold the refresh rate, one game
; frame per strobe cycle (e.g. 60 fps at 120 Hz with 2 frames) instead of frames dropped unevenly (judder). Back to
; Refresh when the game's Reflex reports show its frames fit a refresh, or, without them, after a ~3 s try that holds
; the refresh rate (after 30 s, 60 s, then every 120 s). DX games with NVIDIA Reflex: steps down with Reflex's frame
; limit (one presented frame per strobe cycle), also with frame generation (tries Refresh only every 5 minutes then).
; Vulkan games with NVIDIA Reflex and frame generation: the same with Reflex's frame limit, applied in the game's
; Reflex sleep, only while it leaves about 30 rendered fps or more (2x at 120 Hz; 3x stays at Refresh).
; Frame generation without Reflex: stays at Refresh.
AutoFrameCap=1
; DX games with NVIDIA Reflex, caps below the refresh rate (CapGameToRefresh 2-5): 1 = apply the cap with Reflex's
; own frame limit instead of just-in-time release. Only for games whose frames arrive irregularly at Half or Quarter
; (just-in-time release keeps switching off, motion stutters: The Midnight Walk). Adds ~10-20 ms latency and is no
; smoother where just-in-time release works. 0 = off (default).
CapWithReflex=0
; DX games with NVIDIA Reflex, capped with Reflex's frame limit at the game's sleep (e.g. the automatic frame cap),
; without frame generation and with Lowest latency pacing (FramePacing=1): 1 = the game's frame start is moved so
; its frames are ready just before the lit refresh picks them (about 2 ms ahead) instead of waiting up to a whole
; strobe cycle. God of War Ragnarok: about 7 ms less from release to flash. Games with uneven frame times gain
; little and can repeat a frame now and then (Spider-Man 2). 0 = off (default).
ReflexAlign=0
; DX games with NVIDIA Reflex: 1 = the frame limit above (and the automatic frame cap's) is applied by the
; presenter in the game's own Reflex sleep call at the start of each frame. 0 = the driver's Reflex limit, which
; counts the presenter's own presents and collapsed some games to ~7 fps (The Witcher 3, Returnal, Pragmata).
; Games that call their Reflex sleep more than once per rendered frame keep the driver's limit either way.
ReflexLimitAtSleep=1
; DX games with NVIDIA Reflex: 0 = the automatic frame cap steps down with Reflex's frame limit, with frame
; generation or without. 1 = the presenter's own cap (just-in-time release) while frame generation is off,
; Reflex's frame limit while it is on, following frame generation as it is switched on and off.
AutoCapOwnWithoutFg=0
; 1 = present on the add-on's own GPU queue (independent of the game's GPU load);
; 0 = present (and draw) on the game's queue -- strobe timing then follows the game's GPU work
PresentOnOwnQueue=1
; 1 = wait for vblank before each present (lowest latency); 0 = present queue only
WaitForVBlank=1
; 1 = timing log: BFIPresenter_log_<date>_<time>.csv next to this file (can be switched in the overlay)
Log=0
; 1 = enable D3D12 DRED diagnostics: on a crash (device removed) a report of the last
; GPU operations is written to ReShade.log and BFIPresenter_dred.txt. Small overhead.
; 2 = also the D3D12 debug layer: every invalid D3D12 call is written to BFIPresenter_debug.txt
; (needs the Windows optional feature "Graphics Tools"; slower -- for diagnosing crashes only).
; Read at game start.
Diagnostics=1
; DX add-on: 1 = write serious exceptions in the game to BFIPresenter_crash.txt; 0 = no crash logger at all
CrashLog=1
; RivaTuner (RTSS) hooked into the game: 1 = manage anyway and show a warning (default);
; 0 = refuse. RTSS's OSD and frame limiter run inside the presenter: keep the limiter off and
; don't toggle the OSD while playing -- changing them crashed Control in testing.
AllowRTSS=1
; 1 = lowest latency: the newest finished frame (default for new ini files)
; 0 = smooth: every game frame shown once, in order (about one refresh more latency); only worth it at the Half or
;     Quarter cap when the just-in-time release is at its limit. Existing ini files keep their own value.
FramePacing=1
; Smooth only: 1 = after a game hitch, skip a frame to get back to the lowest latency (a second stutter shortly
; after the first). 0 (default) = stay one frame behind (about one cycle more latency) and show every frame in order.
SmoothCatchUp=0
; Just-in-time release at the Half / Quarter cap (1 = on, default): each game frame is released at its lit refresh
; minus the measured frame time and the margin below, so every frame lands on the same lit refresh (no repeat-then-skip
; at Half, no frames held 1 then 3 cycles at Quarter). At its limit it releases as early as the cap allows.
CapJustInTime=1
; Later release at the Refresh cap (1 = on): with FramePacing=1 (Lowest latency), the game is released just in time for
; the refresh that shows its frame instead of a full refresh earlier -- up to ~5 ms less latency in games that render
; well within a refresh. Does nothing while frames take nearly a whole refresh. Not for frame generation.
LaterRelease=0
; Safety margin (ms) on top of the measured frame time, for both of the above; widens by itself after misses
LaterReleaseMarginMs=1.5
; Frames the game may queue on the GPU ahead of the screen: 1 = lowest input lag
; (like a low-latency mode), 2 if the frame rate drops, 0 = no limit
MaxFramesAhead=1
; Real swap chain buffers behind the presenter (2-4, applies at the game's next resize).
; 3 or 4 with WaitForVBlank=0 lets the presenter queue frames ahead, so a late slot does not
; flash -- at the cost of 1-2 refreshes of latency. 2 with WaitForVBlank=1 = lowest latency.
PresenterBuffers=3
; 1 = with WaitForVBlank=1 and PresenterBuffers=3: keep exactly one extra present queued, so an
; occasional late slot doesn't flash (+8 ms latency); the queue never grows, so the driver doesn't throttle the game
; Vulkan layer: keeps one extra finished refresh queued (WaitForVBlank=1, PresenterBuffers=3). Covers draws the
; game's GPU work delays -- a held lit or dark refresh (a flash) in GPU-heavy games such as Indiana Jones. +1 refresh.
QueueAhead=0
; 1 = when the game destroys and recreates its swap chain (God of War Ragnarok on loading), the game presents
; its own frames (no BFI) until it resizes the swap chain -- change resolution or display mode once to start BFI.
; 0 = start BFI immediately on the game's queue (hung God of War Ragnarok)
WaitForResizeOnRecreatedSwapChain=1
; 1 = frame statistics and present count the game reads describe its own frames (shown / presented),
; not the presenter's 120 presents per second. 0 = real values.
GameFrameStatistics=1
; 1 = when a refresh would draw the same game frame with the same settings into a buffer that already
; holds it, present that buffer again without drawing (no GPU work, so a GPU busy with the game can't hold
; up the strobe). Works best when PresenterBuffers is a multiple of Frames: 4 with QueueAhead=1, or 2.
ReuseDrawnBuffers=1
; 1 = for every swap chain, the game presents its own frames (no BFI) until it first resizes the swap chain
; (nearly all games do at start-up); BFI then starts on the presenter's own queue. If BFI doesn't start,
; change resolution or display mode once. 0 = start BFI on the game's queue right away (deadlocked Pragmata)
StartBFIAfterGameResize=1
; 1 = BFI Presenter's own presents and its move onto the presenter queue call DXGI directly, past overlay
; hooks (Steam's gameoverlayrenderer64 hung and then recursed in Pragmata). Overlays (RTSS OSD) then don't
; draw on the strobed frames. 0 = call through the hooks.
BypassOverlayResizeHooks=1
; 1 = the presenter's presents go through overlay hooks, so the RTSS OSD and the Steam overlay draw on the
; strobed frames. 64-bit DirectX games only: ignored in 32-bit games (they crashed or showed nothing) and
; OpenGL games; Vulkan games show them anyway. Steam's hook crashed some 64-bit games this way too
; (Pragmata, Resident Evil 4): turn it off again if the game crashes. Keep RTSS's frame limiter off.
; Applies at the next game start.
ShowOverlays=0
; Presenter GPU queue priority: 0 = normal, 1 = high, 2 = global realtime when Windows allows it
; (game run as administrator), otherwise high. Read at game start. Try 1 or 0 if a game hangs the GPU
; with BFI Presenter (Resident Evil 4): fewer interruptions of the game's GPU work, more late refreshes.
PresenterQueuePriority=2
; 1 = the stand-in back buffers report the swap chain's typed format (e.g. R8G8B8A8_UNORM) when the game
; asks for their description, as real swap-chain buffers do (The Last of Us Part I crashed without it). 0 = off.
TypedBackBufferDesc=1
; Hitch guard: 1 = while the presenter misses refreshes (3 within half a second) or the game delivers no new
; frame for HitchGuardLoadingMs (loading screens), every refresh is shown at the strobe's average brightness
; instead of strobing, so pausing changes motion clarity but not brightness; BFI returns after 1 s.
; Ordinary gameplay hitches shorter than HitchGuardLoadingMs keep strobing (the frozen frame is strobed cleanly).
HitchGuard=1
HitchGuardLoadingMs=1000
; 1 = when refreshes are missed in 3 of 10 seconds (loading doesn't count), the overlay's status box suggests
; the next step, one at a time: run the launcher as administrator (DX), 4 presenter buffers, Queue one refresh
; ahead, then lighter game settings. Its buttons write the setting here. 0 = hidden (the Hide button sets it).
FlashHints=1
; 1 = automatic frames ahead: 1 (least latency) normally, 2 while the game keeps missing strobe cycles
; (2+ per second for 3 s), back to 1 once it waits over 6 ms per frame in the frame cap for 10 s;
; if 2 is needed again within a minute, it stays at 2 for the rest of the session.
; 0 = use MaxFramesAhead as set.
AutoFramesAhead=1
; ABL guard (HDR only): OLED panels dim the picture when a refresh puts out too much light for the size of the
; bright area; with BFI the lit refresh carries the boost. The lit-refresh ceiling is lowered just enough that every
; bright area stays within what the panel sustains at its size (the rest spills into the dark refresh): a white
; screen gets a low ceiling, small highlights keep the full one. Set the budget to your display's full-white (100%
; window) brightness: 250 for the Sony A95L and similar QD-OLEDs; many WOLEDs are lower (150-200).
AblGuard=1
AblGuardBudgetNits=250
; The panel's window curve: sustained brightness by size of the white area, as "area%:nits" pairs from a review,
; e.g. AblCurve=10:1400,25:600,50:400,100:250. Empty = DisplayPeakNits at 10% down to AblGuardBudgetNits at 100%.
AblCurve=


; --- DX add-on only (BFIPresenter.addon64) ---
; 1 = manage Direct3D 11 games too (the game keeps its DX11 device and DLSS; frames are shown by the add-on's own
; D3D12 presenter on a window laid over the game's). Use borderless/windowed fullscreen in DX11 games.
DX11Support=1
; 1 = the game's own DX11 swap chain still presents each frame (hidden under the presenter's window). For games whose
; frames get slower and slower while the presenter runs (Wreckfest); 0 = it never presents (normal).
DX11GamePresent=0
; 1 = manage Direct3D 9 games too (needs ReShade 6.8+): the game's device is created as Direct3D 9Ex so its frames
; can be shared, the game is kept windowed (borderless at full size), and the frames are shown by the same presenter.
DX9Support=1
; 1 = manage OpenGL games too (NVIDIA GPUs only: frames are shared through WGL_NV_DX_interop2).
OpenGLSupport=1
; 1 = set the OpenGL game's swap interval to 0 so its own SwapBuffers doesn't wait for vblank; 0 = keep the game's.
OpenGLSwapInterval0=1
; 1 = where exclusive fullscreen is held off (DX11, DX9), make the game's window borderless over its monitor.
BorderlessFullscreen=1

; --- Vulkan layer only (BFIPresenterVK) ---
; 0 = the Vulkan layer stays off in this game even with this ini present.
VulkanLayer=1
; 1 = the presenter gets a GPU queue of its own (normal); 0 = it shares the game queue.
VulkanOwnQueue=1
; 1 = the presenter's own swap chain runs in exclusive fullscreen (the game's window mode is unchanged): overlays
; such as RivaTuner's OSD and alt-tab can't move presentation into the desktop compositor, where the strobe flashes.
; Applies at the next game start.
VulkanExclusiveFullscreen=1
; 1 = when the display keeps handing frames back late for 3 seconds (after a window covered the game, e.g. a launcher's
; splash screen, or the ReShade menu was open), the game is asked to rebuild its swap chain: a short pause, at most
; every 20 seconds. Ctrl+Shift+O does it by hand.
VulkanAutoRecover=1
; SDR games (emulators): 1 = present as HDR10 when Windows HDR is on, so the lit refresh has headroom.
SdrToHdr=1
; Brightness of SDR white in that mode (match Windows' SDR content brightness).
SdrWhiteNits=200
; HDR look for SDR games: highlights above SdrHighlightKnee (signal 0..1) stretch toward SdrHighlightNits (0 = off).
SdrHighlightNits=800
SdrHighlightKnee=0.65
